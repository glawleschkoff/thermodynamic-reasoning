<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Thermodynamic Reasoning</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1116; color: #d8dde6; font-family: system-ui, sans-serif; overflow: hidden; }
  :root { --ph: 0px; --vh: 100vh; --bar: 76px; }
  @supports (height: 100dvh) { :root { --vh: 100dvh; } }   /* follows the Safari toolbars on phones */
  @media (max-height: 520px), (max-width: 700px) { :root { --bar: 60px; } #ctrl { height: 60px !important; padding: 8px 16px !important; } .plot { height: calc((var(--vh) - var(--bar)) / 2.6 - 1px) !important; } }   /* small screens: 1.3 plots visible */   /* height of the slid-out 2D plot window */
  body.plots-open { --ph: calc((var(--vh) - var(--bar)) / 2); }   /* plot window = half of the available height (1/2 : 1/2) */
  #plots { position: fixed; left: 0; right: 0; bottom: var(--bar); height: var(--ph); overflow-x: hidden; overflow-y: auto; background: #12161d; border-top: 2px solid #3a4356; box-sizing: border-box; transition: height .35s ease; }
  .plot { position: relative; height: calc((var(--vh) - var(--bar)) / 4.6 - 1px); border-bottom: 1px solid #3a4356; box-sizing: border-box; }
  .plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .plot.active { box-shadow: inset 0 0 0 4px #b8c0cc; }
  .plot .cur { position: absolute; top: 0; bottom: 0; width: 1px; background: #fff; opacity: .8; pointer-events: none; }
  .plot .ttl { display: none; position: absolute; left: 10px; top: 6px; font-size: 13px; font-weight: 600; color: #cbd5e1; pointer-events: none; }
  #plotsToggle { position: fixed; left: 50%; bottom: calc(var(--bar) + var(--ph)); transition: bottom .35s ease; transform: translateX(-50%); width: 64px; height: 22px; padding: 0; border-radius: 8px 8px 0 0; border-bottom: none; background: #1d2430; z-index: 5; display: flex; align-items: center; justify-content: center; }
  #plotsToggle svg { transition: transform .35s ease; }
  body.plots-open #plotsToggle svg { transform: rotate(180deg); }
  #left { position: fixed; top: 0; bottom: calc(var(--bar) + var(--ph)); transition: bottom .35s ease; left: 0; width: 33.333%; background: #1a212a; border-right: 2px solid #3a4356; box-sizing: border-box; }
  #right { position: fixed; top: 0; bottom: calc(var(--bar) + var(--ph)); transition: bottom .35s ease; left: 33.333%; right: 0; }
  #c, #c2 { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
  #info { position: fixed; top: 12px; left: calc(33.333% + 16px); max-width: 420px; font-size: 13px; line-height: 1.4; pointer-events: none; }
  #info h1 { font-size: 17px; margin: 0 0 4px; }
  #labels { position: fixed; top: 0; left: 0; right: 0; bottom: calc(var(--bar) + var(--ph)); transition: bottom .35s ease; pointer-events: none; clip-path: inset(0 0 0 33.333%); }   /* Labels nur im rechten Bereich zeigen */
  #labels div { position: fixed; left: 0; top: 0; will-change: transform; font-size: 14px; font-weight: 600; pointer-events: none; white-space: nowrap; text-align: center; }
  #ctrl { position: fixed; bottom: 0; left: 0; right: 0; height: var(--bar); box-sizing: border-box; padding: 16px; background: #161b22cc; display: flex; gap: 12px; align-items: center; }
  #ctrl { align-items: flex-start; }
  @media (max-width: 700px), (max-height: 520px) { #labels div { font-size: 10px; } }
  #tl { flex: 1; position: relative; margin-top: 4px; height: 40px; }   /* bar incl. text 10 px higher: gap above ≈ gap below */
  #tl input[type=range]#t { width: 100%; margin: 0; display: block; height: 16px; }
  #segs { position: absolute; left: 8px; right: 8px; top: 0; height: 16px; pointer-events: none; }
  .bead { position: absolute; top: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px; box-sizing: border-box; border-radius: 50%; background: #ffffff; border: 2.5px solid #000000; cursor: pointer; pointer-events: auto; }
  .bead span { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); font-size: 11px; white-space: nowrap; color: #ffffff; }
  .bead.on { width: 30px; height: 30px; margin: -15px 0 0 -15px; }
  .bead.on span { color: #ffffff; font-weight: 700; top: 33px; }
  #play { width: 44px; height: 44px; padding: 0; font-size: 18px; line-height: 1; display: flex; align-items: center; justify-content: center; flex: none; }
  button { background: #2a3140; color: #d8dde6; border: 1px solid #3a4356; border-radius: 4px; padding: 4px 12px; cursor: pointer; }
  #status { position: fixed; top: 12px; right: 16px; font-size: 12px; font-family: monospace; }
</style>
</head>
<body>
<div id="left"><canvas id="c2"></canvas></div>
<div id="right"><canvas id="c"></canvas></div>
<div id="info" style="display:none">
  <h1>Freie Langevin-Dynamik von 16 p-bits</h1>
  Oben: hidden state s = (x₀, x₁). Unten: Observation o = (x₂, x₃).<br>
  Fläche = Energie, Kugel = aktueller Zustand. Die Kopplung J kippt die Landschaft des Partners.
</div>
<div id="labels"></div>
<div id="status"></div>
<div id="plots"></div>
<button id="plotsToggle" title="2D-Plots ein-/ausfahren"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 12 L9 5.5 L15 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<div id="ctrl">
  <button id="play">⏸︎</button>
  <div id="tl"><input type="range" id="t" min="0" max="1" step="0.0001" value="0"><div id="segs"></div></div>
</div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script src="data.js?v=1791484360"></script>
<script type="module" src="main.js"></script>
</body>
</html>
